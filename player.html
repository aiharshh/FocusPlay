
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusPlay — Your space to focus</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101113;
      --text: #f5f5f5;
      --muted: #92949c;
      --border: #303238;
      --accent: #a5a5ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #25243a 0%, transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
    }

    .topbar {
      height: 82px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.04);
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .brand span { color: var(--accent); }

    .tagline {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1px;
    }

    main {
      width: min(1080px, 90%);
      margin: 54px auto 0;
    }

    .player {
      overflow: hidden;
      border: 1px solid #383a45;
      border-radius: 14px;
      background: #08090c;
      box-shadow: 0 25px 80px rgba(0,0,0,.3);
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #08090c;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .details {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-top: 25px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(20px, 3vw, 27px);
      line-height: 1.35;
      letter-spacing: -.6px;
      font-weight: 600;
    }

    .channel {
      color: #c1c2cb;
      font-size: 14px;
    }

    .focus-label {
      flex-shrink: 0;
      color: var(--accent);
      border: 1px solid #39384f;
      border-radius: 30px;
      padding: 9px 13px;
      font-size: 12px;
    }

    .youtube-link {
      display: inline-block;
      margin-top: 26px;
      color: #b9baff;
      font-size: 13px;
      text-decoration: none;
    }

    .youtube-link:hover { text-decoration: underline; }

    footer {
      margin: 75px 0 28px;
      text-align: center;
      color: #686b78;
      font-size: 12px;
      letter-spacing: .4px;
    }

    @media (max-width: 600px) {
      .topbar { height: 70px; padding: 0 5%; }
      .brand { font-size: 19px; }
      .tagline { display: none; }
      main { margin-top: 28px; width: 92%; }
      .player { border-radius: 9px; }
      .details { flex-direction: column; gap: 14px; }
      footer { margin-top: 55px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">Focus<span>Play</span></div>
    <div class="tagline">Your space to focus.</div>
  </header>

  <main>
    <section class="player">
      <div class="video-frame">
        <iframe
          id="videoPlayer"
          title="FocusPlay video player"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>
    </section>

    <section class="details">
      <div>
        <h1 id="videoTitle">Loading video...</h1>
        <div class="channel" id="channelName">Loading channel...</div>
      </div>
      <div class="focus-label">◎ Focus Mode</div>
    </section>

    <a
      class="youtube-link"
      id="youtubeLink"
      href="https://www.youtube.com/"
      target="_blank"
      rel="noopener noreferrer">
      Open original video on YouTube ↗
    </a>

    <footer>One video. One purpose. Your focus.</footer>
  </main>

  <script src="player.js"></script>
</body>
</html>
